<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Persiapan TKA: papan ujian dengan checklist, nilai A+, stopwatch, dan pensil -->
  <path d="M30 100c-4-44 34-78 86-80 52-2 96 26 98 70 2 46-34 86-92 90-52 4-88-30-92-80Z" fill="#E3F7FB"/>
  <ellipse cx="120" cy="186" rx="84" ry="8" fill="#152763" fill-opacity=".1"/>

  <!-- papan & kertas -->
  <g transform="rotate(-5 120 110)">
    <rect x="66" y="38" width="112" height="144" rx="16" fill="#4CC9DF" stroke="#152763" stroke-width="4"/>
    <rect x="78" y="54" width="88" height="118" rx="8" fill="#fff" stroke="#152763" stroke-width="4"/>
    <rect x="100" y="30" width="44" height="18" rx="7" fill="#152763"/>
    <circle cx="122" cy="39" r="4" fill="#FFC94D"/>
    <text x="88" y="74" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#152763" letter-spacing="1">TRYOUT</text>
    <!-- baris jawaban -->
    <rect x="88" y="86" width="16" height="16" rx="4" fill="#E3FAF6" stroke="#152763" stroke-width="3"/>
    <path d="M91 94l4 4 8-10" stroke="#0EA997" stroke-width="3.5"/>
    <rect x="110" y="88" width="46" height="5" rx="2.5" fill="#D7DEEE"/>
    <rect x="110" y="97" width="30" height="5" rx="2.5" fill="#E8ECF6"/>
    <rect x="88" y="112" width="16" height="16" rx="4" fill="#E3FAF6" stroke="#152763" stroke-width="3"/>
    <path d="M91 120l4 4 8-10" stroke="#0EA997" stroke-width="3.5"/>
    <rect x="110" y="114" width="40" height="5" rx="2.5" fill="#D7DEEE"/>
    <rect x="110" y="123" width="34" height="5" rx="2.5" fill="#E8ECF6"/>
    <rect x="88" y="138" width="16" height="16" rx="4" fill="#E3FAF6" stroke="#152763" stroke-width="3"/>
    <path d="M91 146l4 4 8-10" stroke="#0EA997" stroke-width="3.5"/>
    <rect x="110" y="140" width="44" height="5" rx="2.5" fill="#D7DEEE"/>
    <rect x="110" y="149" width="24" height="5" rx="2.5" fill="#E8ECF6"/>
  </g>

  <!-- lencana A+ -->
  <path d="M186 34l8 6 10-1 3 9 9 5-4 9 4 9-9 5-3 9-10-1-8 6-8-6-10 1-3-9-9-5 4-9-4-9 9-5 3-9 10 1Z" fill="#FF6B57" stroke="#152763" stroke-width="4"/>
  <text x="186" y="70" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#fff">A+</text>

  <!-- stopwatch -->
  <rect x="45" y="118" width="12" height="9" rx="3" fill="#152763"/>
  <path d="M66 128l5-5" stroke="#152763" stroke-width="4"/>
  <circle cx="51" cy="150" r="24" fill="#FFC94D" stroke="#152763" stroke-width="4"/>
  <circle cx="51" cy="150" r="16" fill="#fff"/>
  <path d="M51 150v-10M51 150l7 5" stroke="#152763" stroke-width="3.5"/>
  <circle cx="51" cy="150" r="2.5" fill="#FF6B57"/>

  <!-- pensil -->
  <g transform="rotate(40 196 140)">
    <rect x="189" y="104" width="14" height="56" rx="3" fill="#FF6B57" stroke="#152763" stroke-width="4"/>
    <path d="M196 108v48" stroke="#fff" stroke-width="3" stroke-opacity=".6"/>
    <rect x="189" y="96" width="14" height="11" rx="4" fill="#FFC94D" stroke="#152763" stroke-width="4"/>
    <path d="M189 160l7 15 7-15Z" fill="#F6D7B5" stroke="#152763" stroke-width="4"/>
  </g>

  <!-- dekorasi -->
  <path d="M32 54l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#22CDB9"/>
  <circle cx="54" cy="34" r="4" fill="#FF6B57"/>
  <circle cx="218" cy="112" r="3.5" fill="#4CC9DF"/>
  <path d="M30 96h10M35 91v10" stroke="#4CC9DF" stroke-width="3"/>
</svg>
